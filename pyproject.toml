[project]
name = "sim2real-actuator"
version = "0.1.0"
description = "Actuator system identification, single-joint simulation and domain randomization — a minimal, dependency-light subset of BAM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OwenZhao9" }]
keywords = ["actuator", "system-identification", "sim2real", "friction", "domain-randomization", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/OwenZhao9/sim2real-actuator"
Repository = "https://github.com/OwenZhao9/sim2real-actuator"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]
# ruff also formats fenced Python inside Markdown; the README's snippets are
# hand-wrapped for reading, so keep the formatter out of them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["sim2real_actuator", "helpers", "digital_twin"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202"]
"examples/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
